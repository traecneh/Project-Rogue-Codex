  <head>
    <meta charset="UTF-8" />
    <title>Dexterity &mdash; Project Rogue Codex</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <link rel="icon" type="image/x-icon" href="images/project-rogue-favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="images/project-rogue-favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="images/project-rogue-favicon-64.png" />
    <link rel="icon" type="image/png" sizes="180x180" href="images/project-rogue-favicon-180.png" />

    <link rel="stylesheet" href="css/dexterity.css?v=codex-2026-09-08-lean-ui" />
    <script src="js/site-search.js?v=codex-2026-09-08-lean-ui" defer></script>
    <script src="js/weapon-specialty.js?v=codex-2026-09-08-lean-ui" defer></script>
    <script src="js/keyword-links.js?v=codex-2026-09-08-lean-ui" defer></script>
    <script src="js/cursor-toggle.js?v=codex-2026-09-08-lean-ui" defer></script>
    <script src="js/perks.js?v=codex-2026-09-08-lean-ui" defer></script>
    <script src="js/rarity-roller.js?v=codex-2026-09-08-lean-ui" defer></script>
    <script src="js/nav-core.js?v=codex-2026-09-08-lean-ui" defer></script>
    <script src="js/dexterity.js?v=codex-2026-09-08-lean-ui" defer></script>
    <link rel="stylesheet" href="css/refresh.css?v=codex-2026-09-08-lean-ui" />
    <link rel="stylesheet" href="css/character.css?v=codex-2026-09-08-lean-ui" />
    <script src="js/character.js?v=codex-2026-09-08-lean-ui" defer></script>
    <script src="js/refresh.js?v=codex-2026-09-08-lean-ui" defer></script>
  </head>
  <body class="character-page">
    <div class="layout">
      <div id="sidebar-root"></div>
      <main class="main-content">
        <header class="content-header">
          <h1 class="content-title">Dexterity</h1>
        </header>

        <span id="dexterity-basics" class="character-anchor" aria-hidden="true"></span>
        <article class="content-section" id="dexterity-calculator">
          <h2>Calculator</h2>

          <div class="dexterity-calculator-widget">
            <div class="dexterity-control-grid">
              <div class="character-control">
<label for="dexterity-skill-slider">Skill: <span data-dexterity-skill>50</span></label>
              <input
                type="range"
                id="dexterity-skill-slider"
                min="0"
                max="120"
                value="50"
                data-dexterity-skill-slider
              />
              </div>

              <div class="character-control">
<label for="dexterity-str-slider">Strength: <span data-dexterity-str>50</span></label>
              <input
                type="range"
                id="dexterity-str-slider"
                min="5"
                max="500"
                value="50"
                data-dexterity-str-slider
              />
              </div>

              <div class="character-control">
<label for="dexterity-dex-slider">Dexterity: <span data-dexterity-dex>50</span></label>
              <input
                type="range"
                id="dexterity-dex-slider"
                min="5"
                max="500"
                value="50"
                data-dexterity-dex-slider
              />
              </div>

              <div class="character-control">
<label for="dexterity-crit-dex-slider">Base Dexterity: <span data-dexterity-crit-dex>150</span></label>
              <input
                type="range"
                id="dexterity-crit-dex-slider"
                min="5"
                max="500"
                value="150"
                data-dexterity-crit-dex-slider
              />
              </div>

              <div class="character-control">
<label for="dexterity-dr-slider">Total Dexterity: <span data-dexterity-dr-dex>120</span></label>
              <input
                type="range"
                id="dexterity-dr-slider"
                min="5"
                max="500"
                value="120"
                data-dexterity-dr-slider
              />
              </div>
            </div>

            <div class="dexterity-output-grid" aria-live="polite">
              <div class="stat-output" data-character-help="1 + (Skill / 50) + (Str / 100) + (Dex / 200). Dexterity contributes half as much as Strength.">
                <span class="stat-output-label">Melee Multiplier</span>
                <span class="stat-output-value" data-dexterity-multiplier>2.75x</span>
              </div>
              <div class="stat-output" data-character-help="Base Dex / 2.5% chance. Uses base Dexterity, excluding race and equipment bonuses.">
                <span class="stat-output-label">Crit Chance</span>
                <span class="stat-output-value" data-dexterity-crit-chance>60.0%</span>
              </div>
              <div class="stat-output" data-character-help="Critical hits deal 1.35x damage.">
                <span class="stat-output-label">Crit Multiplier</span>
                <span class="stat-output-value" data-dexterity-crit-multiplier>1.35x</span>
              </div>
              <div class="stat-output" data-character-help="(Total Dex * 0.00125) / (1 + Total Dex * 0.00125). Uses total Dexterity, including bonuses.">
                <span class="stat-output-label">Damage Reduction</span>
                <span class="stat-output-value" data-dexterity-dr>13.04% DR</span>
              </div>
              <div class="stat-output" data-character-help="Remaining damage from a 1,000-damage hit after the calculated Dexterity reduction.">
                <span class="stat-output-label">Damage Taken</span>
                <span class="stat-output-value" data-dexterity-post-dr>869.6 / 1,000</span>
              </div>
            </div>
          </div>
        </article>

        <article class="content-section" id="dexterity-dr-benchmarks">
          <h2>Damage Reduction Benchmarks</h2>
          <div class="dexterity-benchmark-grid" data-dexterity-dr-chart></div>
        </article>

        <article class="content-section" id="dexterity-races">
          <h2>Race Bonuses</h2>
          <div class="dexterity-context-grid">
            <section class="dexterity-context-card">
              <p class="stat-label">Elf</p>
              <h3>+10 Dexterity</h3>
            </section>

            <section class="dexterity-context-card">
              <p class="stat-label">Dark Elf</p>
              <h3>+5 Dexterity</h3>
            </section>
          </div>
        </article>

        <span id="dexterity-build-context" class="character-anchor" aria-hidden="true"></span>
        <article class="content-section" id="dexterity-perks">
          <h2 data-character-help="[ ] = Tier 1 / 2 / 3. ( ) = weapon attack speeds 750 / 1000 / 1250 / 1500 ms. { } = formulas.">Perks</h2>
          <div class="stat-grid perk-grid" data-perk-stats="dexterity"></div>
        </article>

        <article class="content-section" id="dexterity-gear">
          <h2>Equipment</h2>
          <div class="stat-grid" data-weapon-specialty="Dexterity"></div>
        </article>


      </main>
    </div>
  </body>
</html>
