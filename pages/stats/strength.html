<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Strength &mdash; Project Rogue Codex</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <link rel="icon" type="image/x-icon" href="images/project-rogue-favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="images/project-rogue-favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="images/project-rogue-favicon-64.png" />
    <link rel="icon" type="image/png" sizes="180x180" href="images/project-rogue-favicon-180.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="images/project-rogue-favicon-512.png" />

    <link rel="stylesheet" href="css/strength.css?v=codex-2026-09-08-lean-ui" />
    <script src="js/site-search.js?v=codex-2026-09-08-lean-ui" defer></script>
    <script src="js/weapon-specialty.js?v=codex-2026-09-08-lean-ui" defer></script>
    <script src="js/keyword-links.js?v=codex-2026-09-08-lean-ui" defer></script>
    <script src="js/cursor-toggle.js?v=codex-2026-09-08-lean-ui" defer></script>
    <script src="js/perks.js?v=codex-2026-09-08-lean-ui" defer></script>
    <script src="js/rarity-roller.js?v=codex-2026-09-08-lean-ui" defer></script>
    <script src="js/nav-core.js?v=codex-2026-09-08-lean-ui" defer></script>
    <script src="js/strength.js?v=codex-2026-09-08-lean-ui" defer></script>
    <link rel="stylesheet" href="css/refresh.css?v=codex-2026-09-08-lean-ui" />
    <link rel="stylesheet" href="css/character.css?v=codex-2026-09-08-lean-ui" />
    <script src="js/character.js?v=codex-2026-09-08-lean-ui" defer></script>
    <script src="js/refresh.js?v=codex-2026-09-08-lean-ui" defer></script>
  </head>
  <body class="character-page">
    <div class="layout">
      <div id="sidebar-root"></div>
      <main class="main-content">
        <header class="content-header">
          <h1 class="content-title">Strength</h1>
        </header>

        <span id="strength-basics" class="character-anchor" aria-hidden="true"></span>
        <article class="content-section" id="strength-calculator">
          <h2>Calculator</h2>

          <div class="strength-calculator-widget">
            <div class="strength-control-grid">
              <div class="character-control">
<label for="strength-skill-slider">Skill: <span data-strength-skill>50</span></label>
              <input
                type="range"
                id="strength-skill-slider"
                min="0"
                max="120"
                value="50"
                data-strength-skill-slider
              />
              </div>

              <div class="character-control">
<label for="strength-str-slider">Strength: <span data-strength-str>100</span></label>
              <input
                type="range"
                id="strength-str-slider"
                min="5"
                max="500"
                value="100"
                data-strength-str-slider
              />
              </div>

              <div class="character-control">
<label for="strength-dex-slider">Dexterity: <span data-strength-dex>50</span></label>
              <input
                type="range"
                id="strength-dex-slider"
                min="5"
                max="500"
                value="50"
                data-strength-dex-slider
              />
              </div>

              <div class="character-control">
<label for="strength-level-slider">Level: <span data-strength-level>50</span></label>
              <input
                type="range"
                id="strength-level-slider"
                min="1"
                max="105"
                value="50"
                data-strength-level-slider
              />
              </div>

              <div class="character-control">
<label for="strength-con-slider">Constitution: <span data-strength-con>150</span></label>
              <input
                type="range"
                id="strength-con-slider"
                min="5"
                max="500"
                value="150"
                data-strength-con-slider
              />
              </div>

              <div class="character-control">
<label for="strength-hit-slider">Hit Damage: <span data-strength-hit>100</span></label>
              <input
                type="range"
                id="strength-hit-slider"
                min="1"
                max="2000"
                value="100"
                data-strength-hit-slider
              />
              </div>
            </div>

            <div class="strength-output-grid" aria-live="polite">
              <div class="stat-output" data-character-help="1 + (Skill / 50) + (Str / 100) + (Dex / 200).">
                <span class="stat-output-label">Melee Multiplier</span>
                <span class="stat-output-value" data-strength-multiplier>3.25x</span>
              </div>
              <div class="stat-output" data-character-help="150 + (3 * Strength).">
                <span class="stat-output-label">Max Weight</span>
                <span class="stat-output-value" data-strength-max-weight>450</span>
              </div>
              <div class="stat-output" data-character-help="20 + (Level * 15) + (Con * 10) + (Str * 2).">
                <span class="stat-output-label">Max Health</span>
                <span class="stat-output-value" data-strength-max-health>2,470</span>
              </div>
              <div class="stat-output" data-character-help="Requires 100 Base Strength. Chance per hit: Strength / 10%. Race and equipment bonuses do not unlock the threshold.">
                <span class="stat-output-label">Bleed Chance</span>
                <span class="stat-output-value" data-strength-bleed-chance>10.0%</span>
              </div>
              <div class="stat-output" data-character-help="Each bleed stack deals 7.5% of hit damage. The hit that applied the stack determines its damage.">
                <span class="stat-output-label">Bleed Damage</span>
                <span class="stat-output-value" data-strength-bleed-damage>7.5</span>
              </div>
              <div class="stat-output strength-note">
                <span class="stat-output-label">Bleed Rule</span>
                <span class="stat-output-value" data-strength-bleed-note>Bleed is unlocked.</span>
              </div>
            </div>
          </div>
        </article>

        <article class="content-section" id="strength-weight-benchmarks">
          <h2>Weight Benchmarks</h2>
          <div class="strength-benchmark-grid" data-strength-weight-chart></div>
        </article>

        <span id="strength-bleed" class="character-anchor" aria-hidden="true"></span>
<p class="character-note">Race bonuses: Human +5 Strength; Tundrian +10 Strength.</p>
        <article class="content-section" id="strength-perks">
          <h2 data-character-help="[ ] = Tier 1 / 2 / 3. ( ) = weapon attack speeds 750 / 1000 / 1250 / 1500 ms. { } = formulas.">Perks</h2>
          <div class="stat-grid perk-grid" data-perk-stats="strength"></div>
        </article>

        <article class="content-section" id="strength-gear">
          <h2>Equipment</h2>
          <div class="stat-grid" data-weapon-specialty="Strength"></div>
        </article>


      </main>
    </div>
  </body>
</html>
